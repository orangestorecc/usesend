name: Deploy Madmail

# Só dispara quando o que vai para o servidor realmente muda. Sem os filtros,
# commits de documentação e de infra reimplantavam a produção inteira.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/marketing/**"
      - "apps/docs/**"
      - "mcp/**"
      - "packages/**"
      - "infra/deploy.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-madmail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Precisa ser maior que a janela de acompanhamento abaixo, senão o job é
    # morto antes de o vigia poder concluir qualquer coisa.
    timeout-minutes: 60

    steps:
      # Só para ter a mensagem do commit no e-mail de "está em produção".
      # O deploy em si roda no servidor e não depende deste checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar chave SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "::error::Secrets de deploy não configurados."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # O build leva minutos sem imprimir nada (a saída vai para um
          # arquivo), e a sessão SSH caía por inatividade — matando o build no
          # meio e deixando o .next incompleto. Duas defesas:
          #  1. keepalive, para a conexão não ser considerada ociosa;
          #  2. o deploy roda DESACOPLADO (setsid/nohup) e aqui só
          #     acompanhamos o log, então uma queda de rede não derruba nada.
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
               -o ServerAliveInterval=30 -o ServerAliveCountMax=20
               -p ${DEPLOY_PORT:-2203} $DEPLOY_USER@$DEPLOY_HOST"

          $SSH 'rm -f /opt/madmail/deploy.status /opt/madmail/deploy.out;
                setsid nohup bash -lc "/opt/madmail/deploy.sh > /opt/madmail/deploy.out 2>&1;
                echo \$? > /opt/madmail/deploy.status" >/dev/null 2>&1 &
                sleep 2; echo "deploy iniciado no servidor"'

          # Acompanha até terminar (limite de 45 min). O deploy inteiro passou
          # dos 20 minutos originais quando a documentação cresceu, e o vigia
          # desistia enquanto o servidor ainda estava trabalhando: o build
          # terminava bem, mas o Actions marcava vermelho e mandava e-mail de
          # falha. A janela precisa cobrir o deploy mais lento, não o médio.
          for i in $(seq 1 270); do
            STATUS=$($SSH 'cat /opt/madmail/deploy.status 2>/dev/null' || true)
            if [ -n "$STATUS" ]; then
              $SSH 'cat /opt/madmail/deploy.out'
              if [ "$STATUS" = "0" ]; then
                echo "deploy concluído"
                exit 0
              fi
              echo "::error::deploy falhou no servidor (código $STATUS)"
              exit 1
            fi
            sleep 10
          done
          # Não é o mesmo que "falhou": o deploy roda desacoplado e segue vivo
          # no servidor. Dizer isso aqui evita o reflexo de redeployar por cima
          # de um deploy que ainda está em andamento.
          echo "::error::deploy não terminou em 45 minutos (pode ainda estar rodando no servidor; confira /opt/madmail/deploy.out antes de disparar outro)"
          $SSH 'tail -40 /opt/madmail/deploy.out 2>/dev/null' || true
          exit 1

      - name: Conferir se está no ar
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://app.madmail.com.br/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "app.madmail.com.br respondendo 200"
              exit 0
            fi
            sleep 6
          done
          echo "::error::A aplicação não respondeu 200 após o deploy."
          exit 1

      # O GitHub só manda e-mail quando o workflow FALHA. Este passo fecha o
      # outro lado: avisa quando a demanda está de fato em produção, usando a
      # própria Madmail para enviar.
      - name: Avisar por e-mail que está em produção
        if: success()
        env:
          NOTIFY_API_KEY: ${{ secrets.DEPLOY_NOTIFY_API_KEY }}
          NOTIFY_TO: ${{ secrets.DEPLOY_NOTIFY_TO }}
          NOTIFY_FROM: ${{ secrets.DEPLOY_NOTIFY_FROM }}
        run: |
          if [ -z "$NOTIFY_API_KEY" ] || [ -z "$NOTIFY_TO" ]; then
            echo "Notificação de deploy não configurada (DEPLOY_NOTIFY_API_KEY/DEPLOY_NOTIFY_TO). Pulando."
            exit 0
          fi

          FROM="${NOTIFY_FROM:-deploy@madmail.com.br}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          SUBJECT="Madmail em produção: $(git log -1 --pretty=%s 2>/dev/null || echo "${GITHUB_SHA:0:7}")"

          # jq monta o JSON com escape correto (mensagem de commit tem aspas e acento).
          BODY=$(jq -n \
            --arg from "$FROM" \
            --arg to "$NOTIFY_TO" \
            --arg subject "$SUBJECT" \
            --arg sha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg msg "$(git log -1 --pretty=%B 2>/dev/null || echo '-')" \
            --arg run "$RUN_URL" \
            --arg commit "$COMMIT_URL" \
            '{
              from: $from,
              to: [$to],
              subject: $subject,
              html: ("<p><strong>Deploy concluído</strong> — app.madmail.com.br respondeu 200.</p>"
                + "<p><strong>Commit:</strong> <a href=\"" + $commit + "\">" + $sha[0:7] + "</a><br>"
                + "<strong>Por:</strong> " + $actor + "</p>"
                + "<pre style=\"white-space:pre-wrap\">" + $msg + "</pre>"
                + "<p><a href=\"" + $run + "\">Ver a execução no GitHub Actions</a></p>")
            }')

          code=$(curl -s -o /tmp/notify.out -w '%{http_code}' \
            -X POST https://app.madmail.com.br/api/v1/emails \
            -H "Authorization: Bearer ${NOTIFY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            # Aviso não entregue não invalida um deploy que deu certo.
            echo "::warning::Falha ao enviar o e-mail de deploy (HTTP $code): $(cat /tmp/notify.out)"
          else
            echo "Aviso de produção enviado para $NOTIFY_TO"
          fi
