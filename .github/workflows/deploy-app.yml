name: Deploy Madmail

# Só dispara quando o que vai para o servidor realmente muda. Sem os filtros,
# commits de documentação e de infra reimplantavam a produção inteira.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/marketing/**"
      - "apps/docs/**"
      - "mcp/**"
      - "packages/**"
      - "infra/deploy.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-madmail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Preparar chave SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_PRIVATE_KEY" ]; then
            echo "::error::Secrets de deploy não configurados."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # O build leva minutos sem imprimir nada (a saída vai para um
          # arquivo), e a sessão SSH caía por inatividade — matando o build no
          # meio e deixando o .next incompleto. Duas defesas:
          #  1. keepalive, para a conexão não ser considerada ociosa;
          #  2. o deploy roda DESACOPLADO (setsid/nohup) e aqui só
          #     acompanhamos o log, então uma queda de rede não derruba nada.
          SSH="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
               -o ServerAliveInterval=30 -o ServerAliveCountMax=20
               -p ${DEPLOY_PORT:-2203} $DEPLOY_USER@$DEPLOY_HOST"

          $SSH 'rm -f /opt/madmail/deploy.status /opt/madmail/deploy.out;
                setsid nohup bash -lc "/opt/madmail/deploy.sh > /opt/madmail/deploy.out 2>&1;
                echo \$? > /opt/madmail/deploy.status" >/dev/null 2>&1 &
                sleep 2; echo "deploy iniciado no servidor"'

          # Acompanha até terminar (limite de 20 min).
          for i in $(seq 1 120); do
            STATUS=$($SSH 'cat /opt/madmail/deploy.status 2>/dev/null' || true)
            if [ -n "$STATUS" ]; then
              $SSH 'cat /opt/madmail/deploy.out'
              if [ "$STATUS" = "0" ]; then
                echo "deploy concluído"
                exit 0
              fi
              echo "::error::deploy falhou no servidor (código $STATUS)"
              exit 1
            fi
            sleep 10
          done
          echo "::error::deploy não terminou em 20 minutos"
          $SSH 'tail -40 /opt/madmail/deploy.out 2>/dev/null' || true
          exit 1

      - name: Conferir se está no ar
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://app.madmail.com.br/api/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "app.madmail.com.br respondendo 200"
              exit 0
            fi
            sleep 6
          done
          echo "::error::A aplicação não respondeu 200 após o deploy."
          exit 1
