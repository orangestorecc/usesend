; Renovação do certificado TLS do SMTP (Let's Encrypt, validação DNS).
; O hook em /etc/letsencrypt/renewal-hooks/deploy/ copia o certificado novo
; para /opt/madmail/certs e reinicia o relay.
[program:madmail-certbot]
directory=/opt/madmail
command=/bin/bash /opt/madmail/renovar-certificado-loop.sh
user=deploy
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/certbot.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
