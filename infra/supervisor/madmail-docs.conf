; Documentação (export estático do Mintlify), servida pelo rewrite do app.
;
; O diretório servido fica FORA de apps/docs de propósito. Enquanto morava em
; apps/docs/site, o `mint export` empacotava o próprio export anterior a cada
; deploy: a documentação tem 6 MB, mas o diretório chegou a 5,7 GB e o export
; passou a morrer no limite rígido de 2 GiB de buffer do Node.
[program:madmail-docs]
directory=/opt/madmail/app
command=/usr/bin/node /opt/madmail/app/infra/static-server.mjs /opt/madmail/docs-site 3002
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/docs.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
