; Documentação (export estático do Mintlify), servida pelo rewrite do app.
[program:madmail-docs]
directory=/opt/madmail/app
command=/usr/bin/node /opt/madmail/app/infra/static-server.mjs /opt/madmail/app/apps/docs/site 3002
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/docs.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
