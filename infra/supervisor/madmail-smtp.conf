; Relay SMTP. Recebe e-mail de sistemas que só falam SMTP (WordPress, ERPs,
; ferramentas self-hosted) e repassa para a API pública do próprio app.
;
; Usuário: SMTP_AUTH_USERNAME (padrão "madmail"). Senha: uma API key do time.
;
; Escuta em portas altas porque roda sem privilégio — o proxy da borda mapeia
; 587 -> 2587 e 465 -> 2465.
[program:madmail-smtp]
directory=/opt/madmail/app/apps/smtp-server
command=/usr/bin/node /opt/madmail/app/apps/smtp-server/dist/server.js
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/smtp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
environment=NODE_ENV="production",SMTP_STARTTLS_PORTS="2587",SMTP_TLS_PORTS="2465"
