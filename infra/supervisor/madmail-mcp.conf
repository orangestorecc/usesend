; Servidor MCP. Fica fora do workspace pnpm e roda com tsx, por isso as
; dependências dele são instaladas com npm no deploy.
[program:madmail-mcp]
directory=/opt/madmail/app/mcp
command=/opt/madmail/app/mcp/node_modules/.bin/tsx /opt/madmail/app/mcp/src/server.ts
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/mcp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PORT="8787"
redirect_stderr=true
