; Aplicação principal (Next.js). Serve app.madmail.com.br e, por rewrite de
; host, também o site institucional e a documentação.
[program:madmail-web]
directory=/opt/madmail/app/apps/web
command=/opt/madmail/app/apps/web/node_modules/.bin/next start -p 3000
user=deploy
autostart=true
autorestart=true
startsecs=10
startretries=3
; O Next sobe processos filhos; sem isso o restart deixa órfão segurando a
; porta 3000 e o serviço não volta.
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
