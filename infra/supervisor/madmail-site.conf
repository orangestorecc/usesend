; Site institucional (export estático do Next), servido por um servidor de
; arquivos simples. O app faz o rewrite por host para cá.
[program:madmail-site]
directory=/opt/madmail/app
command=/usr/bin/node /opt/madmail/app/infra/static-server.mjs /opt/madmail/app/apps/marketing/out 3001
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/site.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
