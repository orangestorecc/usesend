; Backup diário do Postgres, com cópia para o S3.
;
; O container não tem cron; o supervisord é o PID 1. Um laço supervisionado
; resolve o agendamento sem instalar mais nada, e ganha de brinde o restart
; automático se o processo morrer.
[program:madmail-backup]
directory=/opt/madmail
command=/bin/bash /opt/madmail/backup-loop.sh
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/madmail/logs/backup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
