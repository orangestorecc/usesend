version: "3.8"

services:
  postgres:
    image: postgres:16
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:7
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - app_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  minio:
    image: minio/minio:latest
    hostname: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${NEXTAUTH_URL}
    command: server /data --address ":9000"
    volumes:
      - minio-data:/data
    networks:
      - app_network
      - npm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  usesend:
    image: ${USESEND_IMAGE}
    hostname: usesend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_IS_CLOUD: ${NEXT_PUBLIC_IS_CLOUD}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT}
      AUTH_EMAIL_RATE_LIMIT: ${AUTH_EMAIL_RATE_LIMIT}
      S3_COMPATIBLE_ACCESS_KEY: ${S3_COMPATIBLE_ACCESS_KEY}
      S3_COMPATIBLE_SECRET_KEY: ${S3_COMPATIBLE_SECRET_KEY}
      S3_COMPATIBLE_API_URL: ${S3_COMPATIBLE_API_URL}
      S3_COMPATIBLE_PUBLIC_URL: ${S3_COMPATIBLE_PUBLIC_URL}
      S3_COMPATIBLE_BUCKET: ${S3_COMPATIBLE_BUCKET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Recebimento de e-mail (SES inbound -> S3). O job de polling SÓ inicia
      # se INBOUND_S3_BUCKET estiver definido. Inbound do SES só existe em
      # us-east-1, independente da região de envio.
      INBOUND_S3_BUCKET: ${INBOUND_S3_BUCKET:-}
      INBOUND_S3_REGION: ${INBOUND_S3_REGION:-us-east-1}
      # Pagamentos (Rede / Banco Inter). As credenciais dos gateways ficam
      # cifradas no banco, geridas em Admin > Pagamentos — aqui vão só os
      # ajustes de ambiente.
      PAYMENTS_SANDBOX: ${PAYMENTS_SANDBOX:-false}
      # Exigido no querystring dos webhooks de pagamento. Sem ele, qualquer um
      # pode postar em /api/webhook/{inter,rede} e forjar confirmação.
      PAYMENTS_WEBHOOK_TOKEN: ${PAYMENTS_WEBHOOK_TOKEN:-}
      # Retenção do log de transações dos gateways (mínimo 30 dias).
      PAYMENT_LOG_RETENTION_DAYS: ${PAYMENT_LOG_RETENTION_DAYS:-90}
      # Geração de conteúdo por IA no editor de e-mail.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Limpeza de corpos de e-mail antigos (vazio = desligado).
      EMAIL_CLEANUP_DAYS: ${EMAIL_CLEANUP_DAYS:-}
    networks:
      - app_network
      - npm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  mcp:
    image: ${MCP_IMAGE}
    hostname: mcp
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      - usesend
    environment:
      PORT: 8787
      # Fala com o useSend pela rede interna (sem sair pra internet).
      # Auth/escopos/planos vêm do banco (McpKey), geridos em Developer Settings > MCP.
      USESEND_BASE_URL: http://usesend:3000/api
      # URL pública do endpoint MCP (precisa terminar em /mcp). É a partir dela
      # que se deriva o /.well-known/oauth-protected-resource.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.madmail.com.br/mcp}
      # Servidor de autorização OAuth = o app. Deve ser IGUAL ao NEXTAUTH_URL do
      # serviço usesend, senão a descoberta OAuth quebra.
      AUTH_SERVER_URL: ${AUTH_SERVER_URL:-https://app.madmail.com.br}
    networks:
      - app_network
      - npm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  postgres-data:
    external: true
  redis-data:
    external: true
  minio-data:
    external: true

networks:
  npm_public:
    external: true
  app_network:
    external: true
