server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Next static export: URLs limpas (/ai -> /ai.html). Desconhecido -> 404 real.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Assets com hash: cache longo
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Markdown para IA/GEO e arquivos de SEO
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
  location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
}
